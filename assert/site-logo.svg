<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="foryouos 搜索">
  <!-- 站点标识：放大镜（同时用作浏览器标签栏图标）。
       这个文件要同时满足两种显示尺寸 —— 页面上的 35~40px，和标签栏上的 16~20px ——
       所以按小尺寸优先来设计。四处针对小尺寸的取舍：
         1. 镜片里原来那两条「搜索结果」横线全部去掉。48 画布缩到 16px 只剩 1/3，
            两条间距 6.8 单位的线会并成一条糊线，纯粹是噪音；放大镜的剪影本身
            就已经把「搜索」说清楚了。
         2. 笔画统一到 5.5（原来圆环 3.6、手柄 4.2）—— 16px 下约 1.8px，才立得住。
            顺带修掉原来「手柄比圆环粗」的头轻脚重。
         3. 主体撑满画布：圆外沿到 4.25、手柄末端到 43.75，占满 48 的 82%
            （原来只占 68%，四周一圈空白，缩到 16px 就显得小）。
         4. **镜片不填充**（`fill="none"`）。试过填白：镜片那块白在暖黄的背景插画上
            非常跳，像是给图标凭空贴了一块底色；填淡绿也同样多一层无谓的面。
            纯线性 —— 环 + 手柄 —— 才是放大镜最干净的样子，
            而 16px 下轮廓本来就由这根 1.8px 的绿环主导，去掉填充并不损失识别度。 -->
  <circle cx="20" cy="20" r="13" fill="none" stroke="#12b76a" stroke-width="5.5"/>
  <path d="M29.2 29.2 41 41" fill="none" stroke="#12b76a" stroke-width="5.5" stroke-linecap="round"/>
</svg>
