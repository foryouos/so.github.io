<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="never">
    <!-- ============ 站点图标（与 PC 端同一套文件） ============ -->
    <!-- favicon.ico 在站点根目录：抓取器优先取 /favicon.ico，只声明 SVG 时大多会被忽略，
         搜索结果里就退回默认的「地球」图标。 -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="assert/site-logo.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="mask-icon" href="mask-icon.svg" color="#12b76a">
    <link rel="manifest" href="site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="foryouos 导航">
    <meta name="application-name" content="foryouos 导航">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="msapplication-TileColor" content="#12b76a">
    <meta name="theme-color" content="#12b76a">

    <!-- ============ 基础 SEO ============ -->
    <title>foryouos 导航 · 自建聚合搜索入口</title>
    <meta name="keywords" content="foryouos,搜索导航,聚合搜索,必应,百度,导航页,手机搜索"/>
    <meta name="description" content="foryouos 搜索导航页的移动端：只保留搜索区，默认必应，可切换百度 / Google / 知乎 / B站 / 豆瓣等。"/>
    <meta name="author" content="foryouos"/>
    <meta http-equiv="content-Type" content="text/html;charset=utf-8"/>
    <meta name="robots" content="noindex,follow"/>
    <!-- 本页是按 UA 分流的移动端版本，内容与首页一致 —— 声明 canonical 指回首页，
         免得搜索引擎把它当成重复页面单独收录。 -->
    <link rel="canonical" href="https://www.so.foryouos.cn/"/>


    <script>
      function browserRedirect() {
          var sUserAgent = navigator.userAgent.toLowerCase();
          var bIsIpad = sUserAgent.match(/ipad/i) == "ipad";
          var bIsIphoneOs = sUserAgent.match(/iphone os/i) == "iphone os";
          var bIsMidp = sUserAgent.match(/midp/i) == "midp";
          var bIsUc7 = sUserAgent.match(/rv:1.2.3.4/i) == "rv:1.2.3.4";
          var bIsUc = sUserAgent.match(/ucweb/i) == "ucweb";
          var bIsAndroid = sUserAgent.match(/android/i) == "android";
          var bIsCE = sUserAgent.match(/windows ce/i) == "windows ce";
          var bIsWM = sUserAgent.match(/windows mobile/i) == "windows mobile";
          if ( bIsIphoneOs || bIsMidp || bIsUc7 || bIsUc || bIsAndroid || bIsCE || bIsWM) {
              //跳转移动端页面
              //window.location.href = "mobile.html";
          } else {
              //跳转pc端页面
             window.location.href = "index.html";
              }
          }
          browserRedirect();
    </script>
    <!-- 和风天气组件已按需求移除：手机端只保留搜索区。
         原来的 WIDGET 配置块、widget.qweather.net 的脚本、以及 mobile.js（里面只有天气定位逻辑）
         都已摘掉。mobile.js 文件仍留在仓库里，将来要恢复天气，把 <script src="mobile.js"> 加回来即可。 -->
    <script src="search.js" type="text/javascript"></script>
    <link rel="stylesheet" href="mobile.css" >

</head>
<body>

    <!--搜索框：引擎标签 + 输入框 + 联想下拉，逻辑见 search.js-->
    <!--如需打开页面时不自动弹出键盘，去掉下面 input 上的 autofocus 即可-->
    <div id="so_fram" data-fy-search>
      <!-- 站点标识（放大镜 + foryouos 搜索）：纯静态标识、**不可点击**，用 <span> 而非 <a>；
           绝对定位浮在搜索区上方，不占文档流 -->
      <span id="site-logo">
        <img src="assert/site-logo.svg" alt="">
        <span class="sl-text"><span class="sl-name">foryouos</span><span class="sl-sub">搜索</span></span>
      </span>
      <!--搜索引擎切换标签由 search.js 依据配置生成-->
      <div class="so-engines" role="group" aria-label="选择搜索引擎"></div>

      <!--action / name 保留原生提交能力：JS 未加载时回车仍会走必应搜索-->
      <form id="frame_so" name="soform" action="https://cn.bing.com/search" method="get" autocomplete="off">
        <div class="so-input-wrap">
          <!--输入框左侧的引擎 LOGO，由 search.js 按当前引擎切换-->
          <span class="so-logo" aria-hidden="true"></span>
          <input type="text" class="so-input" id="kw" name="q" autofocus
                 placeholder="在必应中搜索" autocomplete="off" spellcheck="false"
                 role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="so_suggest" aria-label="搜索关键词">
          <button type="button" class="so-clear" hidden aria-label="清空搜索词">&times;</button>
          <div class="so-suggest" id="so_suggest" role="listbox" aria-label="搜索建议" hidden></div>
        </div>
        <input type="submit" class="so-submit" value="搜索">
      </form>
    </div>

    <!-- 画廊（博客/主页/Github 三个图标）与页脚（Blog | GitHub）已按需求移除：
         手机端只留搜索区，其余内容在窄屏上视觉上铺不开。 -->
</body>

</html>
