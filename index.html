        "@id": "https://www.so.foryouos.cn/#navigation",

        "itemListElement": [

          { "@type": "SiteNavigationElement", "position": 2, "name": "一刻相册", "url": "https://photo.baidu.com/" },

          { "@type": "SiteNavigationElement", "position": 5, "name": "Canva 可画", "url": "https://www.canva.cn/" },
          { "@type": "SiteNavigationElement", "position": 6, "name": "CSDN", "url": "https://www.csdn.net/" },
          { "@type": "SiteNavigationElement", "position": 7, "name": "微信读书", "url": "https://weread.qq.com/" },

          { "@type": "SiteNavigationElement", "position": 9, "name": "网易云音乐", "url": "https://music.163.com/" },
          { "@type": "SiteNavigationElement", "position": 10, "name": "Cloudflare", "url": "https://dash.cloudflare.com/" }
        ]
      }
    ]
  }

  <!--  判断手机类型实现切换-->
  <script>
      function browserRedirect() {
          var sUserAgent = navigator.userAgent.toLowerCase();
          var bIsIpad = sUserAgent.match(/ipad/i) == "ipad";
          var bIsIphoneOs = sUserAgent.match(/iphone os/i) == "iphone os";
          var bIsMidp = sUserAgent.match(/midp/i) == "midp";
          var bIsUc7 = sUserAgent.match(/rv:1.2.3.4/i) == "rv:1.2.3.4";
          var bIsUc = sUserAgent.match(/ucweb/i) == "ucweb";
          var bIsAndroid = sUserAgent.match(/android/i) == "android";
          var bIsCE = sUserAgent.match(/windows ce/i) == "windows ce";
          var bIsWM = sUserAgent.match(/windows mobile/i) == "windows mobile";
          if ( bIsIphoneOs || bIsMidp || bIsUc7 || bIsUc || bIsAndroid || bIsCE || bIsWM) {
              //跳转移动端页面
              window.location.href = "mobile.html";
          } else {
              //跳转pc端页面
             //window.location.href = "index.html";
          }
      }
      browserRedirect();
  </script>
