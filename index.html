foryouos状态栏开源项目，完全自定义化主页
搜索默认使用必应 Bing，引擎可切换、可记忆，逻辑统一在 search.js
同时保留百度 / Google / 知乎 / B站 / GitHub / 豆瓣 等入口
由微信公众号foryouos写下

<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="never">
  <!--网站标签栏的logo-->
  <link rel="icon" sizes="any" href="https://i.imgtg.com/2023/03/09/YQfnF.png">
  <meta name="keywords" content="foryouos浏览器导航页，GitHub UI重构项目"/>
  <meta name="description" content="对UI的重新制作，对友情链接的重新导向，新体验"/>
  <meta name="author" content="https://www.foryouos.cn"/>
  <meta http-equiv="content-Type" content="text/html;charset=utf-8"/>
  <title>foryouos导航页</title>
  <!--  判断手机类型实现切换-->
  <script>
      function browserRedirect() {
          var sUserAgent = navigator.userAgent.toLowerCase();
          var bIsIpad = sUserAgent.match(/ipad/i) == "ipad";
          var bIsIphoneOs = sUserAgent.match(/iphone os/i) == "iphone os";
          var bIsMidp = sUserAgent.match(/midp/i) == "midp";
          var bIsUc7 = sUserAgent.match(/rv:1.2.3.4/i) == "rv:1.2.3.4";
          var bIsUc = sUserAgent.match(/ucweb/i) == "ucweb";
          var bIsAndroid = sUserAgent.match(/android/i) == "android";
          var bIsCE = sUserAgent.match(/windows ce/i) == "windows ce";
          var bIsWM = sUserAgent.match(/windows mobile/i) == "windows mobile";
          if ( bIsIphoneOs || bIsMidp || bIsUc7 || bIsUc || bIsAndroid || bIsCE || bIsWM) {
              //跳转移动端页面
              window.location.href = "mobile.html";
          } else {
              //跳转pc端页面
             //window.location.href = "index.html";
          }
      }
      browserRedirect();
  </script>
  <link rel="stylesheet" href="index.css" >
  <script src="search.js" type="text/javascript"></script>
  <script src="index.js" type="text/javascript"></script>
  <script src="https://widget.qweather.net/simple/static/js/he-simple-common.js?v=2.0"></script>

</head>
<body id="bg">
  <div id="he-plugin-simple"></div>
    <!-- 右上角：foryouos 官网（瓶子的跋涉）的品牌标 —— 官方瓶子的形状，去掉暖黄底改透明，
         配色换成站点主题的绿白系、尺寸缩小一档，详见 assert/brand-foryouos.svg 里的注释 -->
    <a href="https://www.foryouos.cn/" target="_blank">
      <img src="assert/brand-foryouos.svg" class="right_logo2" alt="瓶子的跋涉" title="瓶子的跋涉">
    </a>


  <!--搜索框：引擎标签 + 输入框 + 联想下拉，逻辑见 search.js-->
  <div id="so_fram" data-fy-search>
    <!--搜索引擎切换标签由 search.js 依据配置生成-->
    <div class="so-engines" role="group" aria-label="选择搜索引擎"></div>

    <!--action / name 保留原生提交能力：JS 未加载时回车仍会走必应搜索-->
    <form id="frame_so" name="soform" action="https://cn.bing.com/search" method="get" autocomplete="off">
      <div class="so-input-wrap">
        <!--输入框左侧的引擎 LOGO，由 search.js 按当前引擎切换-->
        <span class="so-logo" aria-hidden="true"></span>
        <input type="text" class="so-input" id="kw" name="q" autofocus
               placeholder="在必应中搜索" autocomplete="off" spellcheck="false"
               role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="so_suggest" aria-label="搜索关键词">
        <button type="button" class="so-clear" hidden aria-label="清空搜索词" title="清空（Esc）">&times;</button>
        <div class="so-suggest" id="so_suggest" role="listbox" aria-label="搜索建议" hidden></div>
      </div>
      <input type="submit" class="so-submit" value="搜索">
    </form>
  </div>
  <!--搜索框下面的内容-->
  <div id="top_colum">
    <!-- ===== 学习组：主图标中国大学MOOC，悬浮后子项绕主图标环形展开 =====
         位置用 --a（角度）+ --i（弹出次序）描述，三个方向互成 120°：
         -90° 正上 / 150° 左下 / 30° 右下。
         加站点只需复制一条 .sub-icon 并改 --a、--i。
         图标统一用 assert/ 下的官方图标（见项目笔记里各站点的来源）。 -->
    <div class="icon-wrapper">
      <a class="main-icon" href="https://www.icourse163.org/" target="_blank" rel="noopener" title="中国大学MOOC">
        <img src="assert/brand-icourse163.png" alt="中国大学MOOC" title="中国大学MOOC" class="image_logo">
      </a>
      <a class="sub-icon" style="--a: -90deg; --i: 0" href="https://open.163.com/" target="_blank"
         rel="noopener" aria-label="网易公开课">
        <img src="assert/brand-netease-open.png" alt="">
        <span class="sub-label">网易公开课</span>
      </a>
      <a class="sub-icon" style="--a: 150deg; --i: 1" href="https://www.xuetangx.com/" target="_blank"
         rel="noopener" aria-label="学堂在线">
        <img src="assert/brand-xuetangx.png" alt="">
        <span class="sub-label">学堂在线</span>
      </a>
      <a class="sub-icon" style="--a: 30deg; --i: 2" href="http://www.chinesemooc.org/" target="_blank"
         rel="noopener" aria-label="华文慕课">
        <!-- 华文慕课官网只提供横版字标、没有方形图标，这里先用文字标补位（透明底）。
             拿到官方方形图标后，把这段 <svg> 整体换成 <img src="assert/brand-chinesemooc.png" alt=""> 即可 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <text x="12" y="16.2" text-anchor="middle" font-family="楷体, KaiTi, serif"
                font-size="9.5" font-weight="700" fill="#b81c22">华文</text>
        </svg>
        <span class="sub-label">华文慕课</span>
      </a>
    </div>

    <a href="https://photo.baidu.com/" target="_blank">
        <img src="https://i.imgtg.com/2023/03/09/YcDna.png" alt="一刻相册" class="image_logo" title="一刻相册">
    </a>
    <a href="https://www.zhihu.com" target="_blank">
      <img src="https://i.imgtg.com/2023/03/09/YcRQs.png" class="image_logo" alt="知乎" title="知乎">
    </a>

    <!-- ===== 视频组：主图标豆瓣，悬浮后 爱奇艺 / 腾讯视频 / B站 / CCTV 绕主图标展开 =====
         四个子项取对角四向（-135/-45/45/135），不用正上正下：
         正下会撞到下一行 #movie（同级 z-index 200 且 DOM 更靠后，会盖住子项），
         对角排布的横向外扩也更小（0.707R），不会压到左边的知乎。
         图标统一用 assert/ 下的官方图标（见项目笔记里各站点的来源）。 -->
    <div class="icon-wrapper">
      <a class="main-icon" href="https://www.douban.com/" target="_blank" rel="noopener" title="豆瓣">
        <img src="assert/brand-douban.png" alt="豆瓣" title="豆瓣" class="image_logo">
      </a>
      <a class="sub-icon" style="--a: -135deg; --i: 0" href="https://v.qq.com/" target="_blank"
         rel="noopener" aria-label="腾讯视频">
        <img src="assert/brand-tencent-video.svg" alt="">
        <span class="sub-label">腾讯视频</span>
      </a>
      <a class="sub-icon" style="--a: -45deg; --i: 1" href="https://www.iqiyi.com/" target="_blank"
         rel="noopener" aria-label="爱奇艺">
        <img src="assert/brand-iqiyi.png" alt="">
        <span class="sub-label">爱奇艺</span>
      </a>
      <a class="sub-icon" style="--a: 45deg; --i: 2" href="https://www.bilibili.com/" target="_blank"
         rel="noopener" aria-label="哔哩哔哩">
        <img src="assert/brand-bilibili.png" alt="">
        <span class="sub-label">B站</span>
      </a>
      <a class="sub-icon" style="--a: 135deg; --i: 3" href="https://www.cctv.com/" target="_blank"
         rel="noopener" aria-label="央视网">
        <img src="assert/brand-cctv.png" alt="">
        <span class="sub-label">CCTV</span>
      </a>
    </div>

    <!-- ===== Canva 可画：主图标进 canva.cn，悬浮后在**正上方**浮现「微信公众号」 =====
         单子项为什么放正上而不是正下：#top_colum 的正下方就是 #movie（同级 z-index 200
         且 DOM 更靠后），向下会盖住子项；正上方则是空的。
         （#movie 里的读书组没有这个约束，所以那边用正下。
           单子项的统一原则 —— 放在这一行「没被占用」的那一侧。）
         公众号用 Canva 中国官网自己的落地页 canva.cn/wechat-official-account/；
         图标取微信官方标识（绿色对话气泡），一眼能认出是公众号。
         主图标用官方**字标 SVG**（80×30，透明底，紫→青渐变）——
         官网的图标版是带底色的渐变圆角方块，不符合「背景透明」的要求。 -->
    <div class="icon-wrapper">
      <a class="main-icon" href="https://www.canva.cn/" target="_blank" rel="noopener" title="Canva 可画">
        <img src="assert/brand-canva.svg" alt="Canva 可画" title="Canva 可画" class="image_logo">
      </a>
      <a class="sub-icon" style="--a: -90deg; --i: 0"
         href="https://www.canva.cn/wechat-official-account/" target="_blank"
         rel="noopener" aria-label="Canva 可画微信公众号">
        <img src="assert/brand-wechat.png" alt="">
        <span class="sub-label">微信公众号</span>
      </a>
    </div>


  </div>
  <div id="movie">
    <a href="https://www.csdn.net/" target="_blank">
      <img src="https://i.imgtg.com/2023/03/09/Yc7rG.png" class="image_logo" alt="CSDN" title="CSDN">
    </a>

    <!-- ===== 读书组：主图标微信读书，悬浮后在正下方弹出「博看书苑」 =====
         单个子项取正下：#movie 下方是空的（页脚已删），不会像 #top_colum 那样撞到下一行；
         也不往左右扩，免得压到右边 AI 组的子项。 -->
    <div class="icon-wrapper">
      <a class="main-icon" href="https://weread.qq.com/" target="_blank" rel="noopener" title="微信读书">
        <img src="assert/brand-weread.png" alt="微信读书" title="微信读书" class="image_logo">
      </a>
      <a class="sub-icon" style="--a: 90deg; --i: 0"
         href="https://zq.bookan.com.cn/?t=index&amp;id=20999" target="_blank"
         rel="noopener" aria-label="博看书苑">
        <img src="assert/brand-bookan.png" alt="">
        <span class="sub-label">博看书苑</span>
      </a>
    </div>

    <!-- ===== AI 工具栏：主图标进 WorkBuddy 网页版，悬浮后 DeepSeek / 豆包 / ChatGPT / Gemini 环绕弹出 =====
         全站统一角度规则：4 项组一律用对角四向 -135/-45/45/135（从左上顺时针），
         3 项组用 -90/30/150，单子项用 90 正下。
         4 项组**不用正交四向**：正交时左右两个子项会伸到同行相邻图标上，
         对角方向的横向外扩只有 0.707R，正好避开。
         与右边的「网站开发工具」组隔着一个图标（232px），两组子项不会互相压住。 -->
    <div class="icon-wrapper">
      <a class="main-icon" href="https://www.workbuddy.cn/" target="_blank" rel="noopener" title="WorkBuddy 网页版">
        <img src="assert/brand-workbuddy.svg" alt="WorkBuddy" title="WorkBuddy 网页版" class="image_logo">
      </a>
      <a class="sub-icon" style="--a: -135deg; --i: 0" href="https://chat.deepseek.com/" target="_blank"
         rel="noopener" aria-label="DeepSeek">
        <img src="assert/brand-deepseek.svg" alt="">
        <span class="sub-label">DeepSeek</span>
      </a>
      <a class="sub-icon" style="--a: -45deg; --i: 1" href="https://www.doubao.com/chat/" target="_blank"
         rel="noopener" aria-label="豆包">
        <img src="assert/brand-doubao.png" alt="">
        <span class="sub-label">豆包</span>
      </a>
      <a class="sub-icon" style="--a: 45deg; --i: 2" href="https://chatgpt.com/" target="_blank"
         rel="noopener" aria-label="ChatGPT">
        <img src="assert/brand-chatgpt.svg" alt="">
        <span class="sub-label">ChatGPT</span>
      </a>
      <a class="sub-icon" style="--a: 135deg; --i: 3" href="https://gemini.google.com/" target="_blank"
         rel="noopener" aria-label="Gemini">
        <img src="assert/brand-gemini.png" alt="">
        <span class="sub-label">Gemini</span>
      </a>
    </div>
    <!-- 帮小忙（tool.browser.qq.com）已按需求删除 -->
    <a href="https://music.163.com/" target="_blank">
      <img src="https://i.imgtg.com/2023/03/09/YcybP.png"  class="image_logo" alt="网易云音乐" title="网易云音乐">
    </a>
    <!-- B站已整合进上方「视频组」的悬浮项，主行不再重复放一份 -->
    <!-- ===== 网站开发工具：主图标点进 Cloudflare，悬浮后四个入口绕主图标弹出 =====
         与 AI 组同规则：4 项用对角四向 -135/-45/45/135（从左上顺时针）。 -->
    <div class="icon-wrapper">
      <a class="main-icon" href="https://dash.cloudflare.com/" target="_blank" rel="noopener" title="Cloudflare">
        <img src="assert/brand-cloudflare.png" alt="Cloudflare" title="Cloudflare" class="image_logo">
      </a>
      <a class="sub-icon" style="--a: -135deg; --i: 0" href="https://dash.cloudflare.com/" target="_blank"
         rel="noopener" aria-label="Cloudflare Page">
        <img src="assert/brand-cloudflare.png" alt="">
        <span class="sub-label">Page</span>
      </a>
      <a class="sub-icon" style="--a: -45deg; --i: 1" href="https://imgtg.com/" target="_blank"
         rel="noopener" aria-label="图床">
        <img src="assert/brand-imgtg.png" alt="">
        <span class="sub-label">图床</span>
      </a>
      <a class="sub-icon" style="--a: 45deg; --i: 2" href="https://hitokoto.cn/" target="_blank"
         rel="noopener" aria-label="一言">
        <img src="assert/brand-hitokoto.png" alt="">
        <span class="sub-label">一言</span>
      </a>
      <a class="sub-icon" style="--a: 135deg; --i: 3" href="https://www.iconfont.cn/" target="_blank"
         rel="noopener" aria-label="iconfont 矢量图">
        <img src="assert/brand-iconfont.svg" alt="">
        <span class="sub-label">矢量图</span>
      </a>
    </div>
  </div>

</body>
</html>
